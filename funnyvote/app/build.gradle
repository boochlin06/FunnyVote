plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

android {
    namespace 'com.heaton.funnyvote'
    compileSdk 34

    defaultConfig {
        applicationId "com.heaton.funnyvote"
        minSdk 23
        targetSdk 34
        versionCode 15
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled = true
            minifyEnabled false
        }
    }

    flavorDimensions = ["default"]
    productFlavors {
        mock {
            dimension "default"
            applicationIdSuffix ".mock"
        }
        prod {
            dimension "default"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            jvmArgs(
                '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED'
            )
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testProdDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/data/local/AppDatabase*.*',
        '**/databinding/*Binding*.*',
        '**/*Activity*.*',
        '**/*Fragment*.*',
        '**/*Adapter*.*',
        '**/*ViewHolder*.*',
        '**/*VH*.*',
        '**/*Dialog*.*',
        '**/*Application*.*',
        '**/analytics/*.*',
        '**/notification/*.*'
    ]

    def debugTree = fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/prodDebug", excludes: fileFilter)
    def javaDebugTree = fileTree(dir: "${project.buildDir}/intermediates/javac/prodDebug/classes", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree, javaDebugTree]))
    executionData.setFrom(fileTree(dir: "${project.buildDir}", includes: [
        "jacoco/testProdDebugUnitTest.exec",
        "outputs/unit_test_code_coverage/prodDebugUnitTest/testProdDebugUnitTest.exec"
    ]))
}

dependencies {
    // AndroidX Core & UI
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Image & UI Helpers
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.amlcurran.showcaseview:library:5.4.3'
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
    implementation 'com.google.android.gms:play-services-analytics:18.0.4'
    implementation 'com.getbase:floatingactionbutton:1.10.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.github.jakob-grabner:Circle-Progress-View:v1.3'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'com.github.ArthurHub:Android-Image-Cropper:2.4.7'
    implementation 'org.apmem.tools:layouts:1.10@aar'
    implementation('cn.trinea.android.view.autoscrollviewpager:android-auto-scroll-view-pager:1.1.2') {
        exclude group: 'com.android.support'
        exclude group: 'com.google.android', module: 'support-v4'
    }
    implementation 'com.github.alvinhkh:TextDrawable:f9f516c43b'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    implementation 'com.github.paolorotolo:appintro:4.2.3'
    implementation 'com.google.guava:guava:33.2.1-android'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.3.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}

